name: Build HookCase

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List HookCase project
        run: |
          xcodebuild \
            -project HookCase-master/HookCase.xcodeproj \
            -list

      - name: Build HookCase x86_64
        run: |
          xcodebuild \
            -project HookCase-master/HookCase.xcodeproj \
            -scheme HookCase \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find HookCase.kext
        run: |
          echo "Searching for HookCase.kext..."
          find ~/Library/Developer/Xcode/DerivedData . \
            -name "HookCase.kext" \
            -print

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          KEXT="$(find ~/Library/Developer/Xcode/DerivedData \
            -name 'HookCase.kext' \
            -path '*Release*' \
            -print \
            -quit)"

          if [ -z "$KEXT" ]; then
            KEXT="$(find . \
              -name 'HookCase.kext' \
              -print \
              -quit)"
          fi

          if [ -z "$KEXT" ]; then
            echo "HookCase.kext was not found"
            exit 1
          fi

          echo "Found: $KEXT"
          cp -R "$KEXT" artifact/

      - name: Verify HookCase binary
        run: |
          echo "Info.plist:"
          plutil -p artifact/HookCase.kext/Contents/Info.plist

          echo
          echo "Binary architecture:"
          file artifact/HookCase.kext/Contents/MacOS/HookCase

      - name: Upload HookCase.kext
        uses: actions/upload-artifact@v4
        with:
          name: HookCase-Release
          path: artifact/HookCase.kext
