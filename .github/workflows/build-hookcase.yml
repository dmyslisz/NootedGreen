name: Build HookCase

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List HookCase schemes
        run: |
          xcodebuild \
            -project HookCase-master/HookCase.xcodeproj \
            -list

      - name: Build HookCase
        run: |
          xcodebuild \
            -project HookCase-master/HookCase.xcodeproj \
            -scheme HookCase \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find HookCase.kext
        run: |
          find ~/Library/Developer/Xcode/DerivedData . \
            -name "HookCase.kext" \
            -print

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          KEXT="$(find ~/Library/Developer/Xcode/DerivedData \
            -name 'HookCase.kext' \
            -path '*Release*' \
            -print \
            -quit)"

          if [ -z "$KEXT" ]; then
            KEXT="$(find . -name 'HookCase.kext' -print -quit)"
          fi

          if [ -z "$KEXT" ]; then
            echo "HookCase.kext not found"
            exit 1
          fi

          cp -R "$KEXT" artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookCase-Release
          path: artifact/HookCase.kext
